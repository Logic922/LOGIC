<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>上传作业 · logicmokou</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
               connect-src https://api.github.com;
               img-src 'self' data: blob:;
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'none';">
<link rel="preload" href="../fonts/hack-regular.woff2" as="font" type="font/woff2" crossorigin>
<script src="vendor/argon2.umd.min.js"></script>
<style>
@font-face{font-family:Hack;src:url('../fonts/hack-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Hack;src:url('../fonts/hack-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0a1216; --fg:#d8e8ec; --dim:#7f99a2; --faint:#4c6570;
  --sel:#a8d8e4; --selfg:#0b2731;
  --c2:#6fbfa8; --c3:#c9b87f; --c4:#4aa8d8; --c5:#5ec8d8; --c6:#5ec8d8; --c14:#8fd6e0;
  --line:#1c2830;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 Hack,Menlo,Consolas,monospace;
  font-variant-ligatures:none;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-touch-callout:none;
}
.app{max-width:820px;margin:0 auto;min-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.app:focus{outline:none}

.head{padding:16px 18px 0;overflow:hidden}
.logo-sm{margin:0;color:var(--c5);font-weight:700;font-size:13px;letter-spacing:.04em}
.logo-sm .v{color:#e0e2e8;font-weight:400;margin-left:1.4ch;font-size:11px}
.sub{margin-top:8px;color:var(--c6);font-weight:700;font-size:12px}
.mode{margin-top:1px;color:var(--faint);font-size:11px;word-break:break-all}

.body{overflow-y:auto;overflow-x:hidden;padding:12px 18px 8px;min-height:0;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

/* ---------- kitty cursor_trail（同主页） ---------- */
#trailcv{position:fixed;inset:0;pointer-events:none;z-index:55}

/* 键值面板（同主页 .details） */
.details{padding:0 0 8px;color:var(--dim);font-size:11.5px;line-height:1.65}
.details .k{color:var(--faint);white-space:pre}
.details .d{color:var(--fg)}
.details .p{color:var(--c4);word-break:break-all}
.details .warn{color:var(--c3)}

/* 输入行 */
.row{display:flex;align-items:baseline;gap:1ch;min-height:22px;line-height:22px;padding-left:2ch;white-space:nowrap}
.row .pf{color:var(--faint)}
.row .pf b{color:var(--c14);font-weight:400}
.row .pf .sym{color:var(--faint);margin:0 .6ch}
input[type=password]{
  font:inherit;color:var(--fg);background:transparent;border:0;
  border-bottom:1px solid var(--line);padding:0 2px;flex:1 1 8ch;min-width:0;outline:none;
  height:20px;line-height:20px;
}
input[type=password]:focus{border-bottom-color:var(--c4)}

/* 菜单行（同主页 .item） */
.menu{padding:6px 0 0}
.item{
  display:flex;align-items:baseline;min-width:0;
  height:22px;line-height:22px;white-space:nowrap;
  color:var(--fg);padding-left:2ch;cursor:pointer;
}
.item .mk{width:2ch;color:var(--c4);font-weight:700;font-size:13px}
.item .nm{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--faint);margin-left:1.4ch;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.item.focus{background:var(--sel);color:var(--selfg)}
.item.focus .mk{color:var(--selfg)}
.item.focus .nm{color:var(--selfg);font-weight:700}
.item.focus .meta{color:#2f4c56}
.item.dis .nm{color:var(--faint)}
.item.dis .meta{color:#3a4a52}
.item.focus.dis{background:#2b3d45}
.item.focus.dis .nm{color:#9fb6c0}
.item.focus.dis .meta{color:#7d949e}
.item.focus.dis .mk{color:#9fb6c0}

/* 离屏可编辑区：Safari 只在可编辑元素聚焦时才派发 paste 事件 */
#pastecatcher{
  position:fixed;left:-9999px;top:0;width:1px;height:1px;
  opacity:0;overflow:hidden;pointer-events:none;
}

/* 预览 */
.preview{display:none;border:1px solid var(--line);background:transparent;padding:6px;margin:8px 0 0;text-align:center}
.preview.on{display:block}
.preview img{max-width:100%;max-height:26vh;object-fit:contain;display:block;margin:0 auto;background:#fff}

/* systemd 风格日志 */
.log{margin-top:10px;font-size:11.5px;line-height:1.55;color:#7f878f}
.log p{margin:0;white-space:pre-wrap;word-break:break-all}
.log .ok{color:var(--c2)}
.log .err{color:#e08b8b}
.log .work{color:var(--c4)}
.log .dim{color:var(--faint)}

.statusbar{
  display:flex;align-items:center;gap:2ch;height:24px;padding:0 18px;
  background:#141b21;border-top:1px solid var(--line);
  color:var(--dim);font-size:11px;user-select:none;
}
.statusbar .keys{display:flex;gap:1.4ch;flex:1;min-width:0;overflow:hidden}
.statusbar kbd{font:inherit;color:var(--fg);background:#202a32;border:1px solid #33404b;
  border-radius:2px;padding:0 3px}
.statusbar .keyhint{color:var(--c6);font-size:11px;min-width:0;overflow:hidden}
.statusbar .pos{color:var(--faint);white-space:nowrap}

@media (max-width:640px){
  .head{padding:10px 12px 0}
  .body{padding:10px 12px 6px}
  .statusbar{padding:0 12px}
  .statusbar .hide-m{display:none}
  .row,.item{padding-left:1ch}
}
</style>
</head>
<body>
<canvas id="trailcv"></canvas>
<div class="app" tabindex="0">
  <div class="head">
    <div class="logo-sm">LOGICMOKOU<span class="v">v1.0</span></div>
    <div class="sub">学校相关 · 上传作业</div>
    <div class="mode">Argon2id + AES-256-CTR &middot; github.com/Logic922/LOGIC</div>
  </div>

  <div class="body">
    <div class="details">
      <div><span class="k">target   </span><span class="p">school/homework.png</span></div>
      <div><span class="k">cipher   </span><span class="d" id="cipherState">未配置</span></div>
    </div>

    <div class="row">
      <span class="pf"><b>密码</b><span class="sym">❯</span></span>
      <input id="password" type="password" placeholder="输入密码" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="menu" id="menu"></div>

    <div class="preview" id="preview"><img id="pv" alt="预览"></div>
    <div class="log" id="log"></div>
  </div>

  <div class="statusbar">
    <span class="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd> 移动</span>
      <span class="hide-m"><kbd>↵</kbd> 执行</span>
      <span><kbd>Esc</kbd> 返回</span>
    </span>
    <span class="keyhint" id="keyhint"></span>
    <span class="pos" id="pos"></span>
  </div>
</div>

<input id="file" type="file" accept="image/*" hidden>
<div id="pastecatcher" contenteditable="true" aria-hidden="true"></div>

<script>
/* ==================== 配置区（部署前修改这里） ==================== */
const CIPHER_B64 = "JOnBpTa6VnMV9JRUvvx3GYEZw3bT4XF5pqNeMcivWOO7ZsbtS1L7Onn5bXBDwtWZJrhj+2Epwf3KpfaPoZwWuwTox4wsQCGg+wrdoe8sdgSKbR5CrkY38n6lYcZct3Czs423KPvEu9ydQMk5z2H372LY";   // 由 make-cipher.html 生成的密文
const REPO       = "Logic922/LOGIC";
const PATH       = "school/homework.png";
const META_PATH  = "school/homework.meta.json";
const BRANCH     = "main";
const VIEW_URL   = "view.html";
/* 压缩参数：长边超过 MAX_EDGE 才缩放；按质量阶梯降到目标体积 */
const MAX_EDGE     = 1600;
const TARGET_RATIO = 0.55;          // 目标体积 = min(原图 * 0.55, TARGET_MAX)
const TARGET_MAX   = 200 * 1024;
const MIN_SRC      = 120 * 1024;    // 小于 120 KB 的图不折腾，直接原样上传
const KEEP_GAIN    = 0.92;          // 达不到 8% 收益就用原图
/* ================================================================ */

const $ = id => document.getElementById(id);
const logEl = $('log'), menuEl = $('menu'), keyEl = $('keyhint'), posEl = $('pos');
let busy = false;

/* ---------- systemd 风格日志 ---------- */
function log(msg, cls){
  const p = document.createElement('p');
  p.className = cls || '';
  p.textContent = msg;
  logEl.appendChild(p);
  p.scrollIntoView({block:'nearest'});
  return p;
}
const PAD = '         ';
const OK  = '[  OK  ] ';
const BAD = '[FAILED] ';

/* ---------- 状态 ---------- */
let fileName = '', fileRef = null;
let pack = null;        // { blob, mime, w, h, orig, sha } —— 压缩后的上传体
let packSeq = 0;        // 换图序号，防止旧压缩结果覆盖新图

const fmtKB = b => b >= 1048576 ? (b/1048576).toFixed(2) + ' MB' : (b/1024).toFixed(b >= 102400 ? 0 : 1) + ' KB';

function cipherReady(){ return CIPHER_B64 && CIPHER_B64.indexOf('REPLACE') !== 0 && CIPHER_B64.length > 40; }

function refresh(){
  const pw = $('password').value;
  const ready = !!(pw && fileRef && cipherReady() && !busy);
  ITEMS[0].dis = !ready;
  render();
  $('cipherState').textContent = cipherReady() ? '已配置' : '未配置（CIPHER_B64 还是占位符）';
  $('cipherState').className = cipherReady() ? 'd' : 'd warn';
}

/* ---------- 菜单 ---------- */
const ITEMS = [
  { n:'解密并上传', d:'替换 school/homework.png，完成后自动跳转', dis:true, run(){ doUpload(); } },
  { n:'选择图片',   d:'从相册或文件里挑一张截图',                dis:false, run(){ $('file').click(); } },
  { n:'从剪贴板粘贴', d:'直接抓剪切板里的截图（也可 Ctrl/Cmd+V）',  dis:false, run(){ pasteFromClipboard(); } },
  { n:'查看作业',   d:'打开当前展示的作业',                      dis:false, run(){ location.href = VIEW_URL; } },
  { n:'返回主页',   d:'回到 logicmokou 主页',                    dis:false, run(){ location.href = '../index.html'; } }
];
let focus = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  menuEl.innerHTML = ITEMS.map((x, i) => {
    const meta = (i === 1 && fileName) ? fileName : x.d;
    return '<div class="item'+(i===focus?' focus':'')+(x.dis?' dis':'')+'" data-i="'+i+'">' +
      '<span class="mk">'+(i===focus?'❯':'')+'</span>' +
      '<span class="nm">'+esc(x.n)+'</span>' +
      '<span class="meta">'+esc(meta)+'</span></div>';
  }).join('');
  posEl.textContent = (focus+1) + '/' + ITEMS.length;
  pushRect(menuEl.querySelector('.item.focus'));
}
function paint(){
  menuEl.querySelectorAll('.item').forEach((el, i) => {
    el.classList.toggle('focus', i === focus);
    el.querySelector('.mk').textContent = (i === focus) ? '❯' : '';
  });
  posEl.textContent = (focus+1) + '/' + ITEMS.length;
  pushRect(menuEl.querySelector('.item.focus'));
}
function move(d){ focus = (focus + d + ITEMS.length) % ITEMS.length; paint(); }
function fire(){
  const x = ITEMS[focus];
  if (!x) return;
  if (x.dis){ keyEl.textContent = '先填密码并选图片'; setTimeout(()=>keyEl.textContent='', 1600); return; }
  x.run();
}

/* 鼠标真的移动过才让 hover 抢焦点，避免载入瞬间指针位置把焦点拽走 */
let pointerMoved = false;
document.addEventListener('pointermove', () => { pointerMoved = true; }, {once:true});

menuEl.addEventListener('mouseover', e => {
  if (!pointerMoved) return;
  const el = e.target.closest('.item'); if (!el) return;
  const i = +el.dataset.i; if (i === focus) return;
  focus = i; paint();
});
menuEl.addEventListener('click', e => {
  const el = e.target.closest('.item'); if (!el) return;
  focus = +el.dataset.i; paint(); setTimeout(fire, 60);
});

/* ---------- 选图（文件选择 / 剪贴板共用） ---------- */
function useFile(f){
  const pv = $('preview'), im = $('pv');
  if (!f || !/^image\//.test(f.type || '')){
    fileName = ''; fileRef = null; pack = null; packSeq++;
    pv.classList.remove('on');
    refresh();
    if (f) log(PAD + 'Not an image: ' + (f.type || 'unknown'), 'err');
    return;
  }
  fileRef = f; pack = null;
  const seq = ++packSeq;
  const base = (f.name || 'clipboard');
  fileName = base + '  ' + fmtKB(f.size) + ' · 压缩中…';

  if (im.dataset.url) URL.revokeObjectURL(im.dataset.url);
  const url = URL.createObjectURL(f);
  im.dataset.url = url; im.src = url; pv.classList.add('on');
  logEl.innerHTML = '';
  refresh();

  compressImage(f).then(p => {
    if (seq !== packSeq) return;
    pack = p;
    const pct = p.orig ? Math.round((1 - p.blob.size / p.orig) * 100) : 0;
    const tag = p.skipped ? '原图为宜'
      : (p.mime === 'image/webp' ? 'webp' : 'jpg') + ' q' + (p.q || '') + ' · ' + p.w + '×' + p.h;
    fileName = base + '  ' + fmtKB(p.orig) + ' → ' + fmtKB(p.blob.size)
             + ' (−' + pct + '%)  ' + tag;
    log(PAD + 'Compressed: ' + fmtKB(p.orig) + ' → ' + fmtKB(p.blob.size)
        + '  ' + p.w + '×' + p.h + '  ' + (p.skipped ? 'kept original' : p.mime), 'ok');
    log(PAD + 'sha256 ' + p.sha.slice(0, 16) + '…', 'dim');
    refresh();
  }).catch(err => {
    if (seq !== packSeq) return;
    fileName = base + '  ' + fmtKB(f.size) + ' · 压缩失败，将用原图';
    log(PAD + 'Compress failed: ' + err.message + '（上传原图）', 'err');
    refresh();
  });
}

/* ---------- 压缩：canvas 重编码，长边 ≤ MAX_EDGE ---------- */
const toBlob = (cv, type, q) => new Promise(r => { try { cv.toBlob(b => r(b), type, q || 0.9); } catch(_) { r(null); } });

function loadImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('图片解码失败（格式不受支持？）')); };
    im.src = u;
  });
}

function loadBitmap(file){
  if (window.createImageBitmap){
    return createImageBitmap(file).catch(() => loadImg(file));
  }
  return loadImg(file);
}

async function sha256Hex(buf){
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
  return Array.from(h, b => b.toString(16).padStart(2, '0')).join('');
}

async function webpOK(){
  if (window.__webpOK === undefined){
    const cv = document.createElement('canvas');
    cv.width = cv.height = 4;
    const b = await toBlob(cv, 'image/webp', 0.9);
    window.__webpOK = !!(b && b.type === 'image/webp');
  }
  return window.__webpOK;
}

async function compressImage(file){
  /* 小图 / 收益不明确：不重编码，保留原始像素 */
  if (file.size <= MIN_SRC){
    return { blob: file, mime: file.type || 'image/png', w: 0, h: 0, orig: file.size,
             skipped: true, sha: await sha256Hex(await file.arrayBuffer()) };
  }

  const bmp = await loadBitmap(file);
  const ow = bmp.width || bmp.naturalWidth;
  const oh = bmp.height || bmp.naturalHeight;
  if (!ow || !oh) throw new Error('图片尺寸无效');

  const edge = Math.max(ow, oh);
  const k = edge > MAX_EDGE ? MAX_EDGE / edge : 1;
  const w = Math.max(1, Math.round(ow * k));
  const h = Math.max(1, Math.round(oh * k));

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = 'high';
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, w, h);
  cx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();

  /* WebP 在 iOS 上不一定编码得出来，先探一次 */
  const useWebp = await webpOK();
  const type = useWebp ? 'image/webp' : 'image/jpeg';
  const ladder = useWebp
    ? [0.92, 0.84, 0.76, 0.68, 0.60]
    : [0.86, 0.78, 0.70, 0.62, 0.54, 0.46];
  const target = Math.min(file.size * TARGET_RATIO, TARGET_MAX);

  let best = null;
  for (const q of ladder){
    const b = await toBlob(cv, type, q);
    if (!b) continue;
    best = { blob: b, q };
    if (b.size <= target) break;          // 取到最高质量的达标档
  }

  /* 压不下来就原样上传，别让体积变大或白掉一层画质 */
  if (!best || best.blob.size > file.size * KEEP_GAIN){
    return { blob: file, mime: file.type || 'image/png', w: ow, h: oh, orig: file.size,
             skipped: true, sha: await sha256Hex(await file.arrayBuffer()) };
  }
  return { blob: best.blob, mime: type, w, h, orig: file.size, q: best.q,
           sha: await sha256Hex(await best.blob.arrayBuffer()) };
}

$('file').addEventListener('change', () => useFile($('file').files[0]));

/* 直接粘贴（Ctrl/Cmd+V）：截图软件复制过的图直接进来 */
document.addEventListener('paste', e => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items){
    if (it.type && it.type.indexOf('image/') === 0){
      const f = it.getAsFile();
      if (f){ e.preventDefault(); useFile(f); return; }
    }
  }
});

/* 点菜单项时读系统剪贴板（需用户手势，iOS 上可能有权限弹窗） */
async function pasteFromClipboard(){
  try {
    if (!navigator.clipboard || !navigator.clipboard.read){
      log(PAD + 'This browser cannot read clipboard. Press Ctrl/Cmd+V instead.', 'err');
      return;
    }
    const items = await navigator.clipboard.read();
    for (const it of items){
      const type = (it.types || []).find(t => t.indexOf('image/') === 0);
      if (type){
        const blob = await it.getType(type);
        useFile(new File([blob], 'clipboard.' + type.split('/')[1], { type }));
        return;
      }
    }
    log(PAD + 'No image in clipboard.', 'dim');
  } catch(err){
    const cat = document.getElementById('pastecatcher');
    if (cat){ try { cat.focus(); } catch(_){} }
    log(PAD + 'Clipboard read refused: ' + err.message, 'err');
    log('→  已就位，按 ' + (/Mac|iPhone|iPad/.test(navigator.platform||'') ? '⌘V' : 'Ctrl+V') + ' 直接粘贴', 'dim');
  }
}
$('password').addEventListener('input', refresh);
$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); doUpload(); }
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === $('password')) return;
  const k = e.key || '';
  if (k === 'ArrowDown' || k === 'j'){ e.preventDefault(); move(1); }
  else if (k === 'ArrowUp' || k === 'k'){ e.preventDefault(); move(-1); }
  else if (k === 'Enter' || k === ' '){ e.preventDefault(); fire(); }
  else if (k === 'Escape' || k === 'q'){ location.href = '../index.html'; }
});

/* ============ 常量：必须与 make-cipher.html 完全一致 ============ */
const ALPHABET     = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_'; // 63 个
const TOKEN_PREFIX = 'github_pat_';   // 公开前缀，不进密文
const KDF          = { parallelism: 4, iterations: 3, memorySize: 262144, hashLength: 32 };

async function deriveKey(password, salt){
  if (!window.hashwasm || !hashwasm.argon2id) throw new Error('Argon2 库未加载（检查网络）');
  return await hashwasm.argon2id({
    password: password, salt: salt,
    parallelism: KDF.parallelism, iterations: KDF.iterations,
    memorySize: KDF.memorySize, hashLength: KDF.hashLength, outputType: 'binary'
  });
}

/* ---------- 解密：salt(16) | counter(16) | ct ----------
   任意密码都解出等长候选凭据：不校验 tag、不查字符集、不抛异常。
   AES-CTR 无认证，decrypt 对任何密钥都成功；seed 满熵，输出分布不可区分。 */
function seedToTail(seed){
  let s = '';
  for (let i = 0; i < seed.length; i++) s += ALPHABET[seed[i] % 63];
  return s;
}

async function decryptToken(password, cB64){
  const c = Uint8Array.from(atob(cB64), ch => ch.charCodeAt(0));
  if (c.length < 48) throw new Error('密文格式不对（长度 ' + c.length + '）');
  const salt    = c.slice(0, 16);
  const counter = c.slice(16, 32);
  const ct      = c.slice(32);
  const rawKey = await deriveKey(password, salt);
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-CTR', false, ['decrypt']);
  const seed = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CTR', counter, length: 128 }, key, ct));
  return TOKEN_PREFIX + seedToTail(seed);
}

/* ---------- Blob → Base64 ---------- */
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('读取文件失败'));
    r.readAsDataURL(blob);
  });
}
const encodePath = p => p.split('/').map(encodeURIComponent).join('/');

/* ---------- 凭据校验交给 GitHub：本地不判定对错 ---------- */
async function verifyToken(token){
  const r = await fetch(`https://api.github.com/repos/${REPO}`, {
    cache: 'no-store',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  });
  let message = '';
  if (!r.ok){
    try { const j = await r.json(); message = (j && j.message) || ''; } catch(_){}
  }
  return { ok: r.ok, status: r.status, message };
}

/* ---------- 单文件写：先取 sha，再 PUT ---------- */
async function putFile(token, path, b64, message){
  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  const apiUrl = `https://api.github.com/repos/${REPO}/contents/${encodePath(path)}`;

  let sha;
  const g = await fetch(`${apiUrl}?ref=${encodeURIComponent(BRANCH)}`, { headers, cache:'no-store' });
  if (g.ok){ sha = (await g.json()).sha; }
  else if (g.status === 401){ throw new Error('Token 无效或已过期，请重新生成并加密'); }
  else if (g.status === 403){ throw new Error('Token 权限不足（需要 Contents: Read and write）'); }
  else if (g.status !== 404){ throw new Error('读取 ' + path + ' 失败：HTTP ' + g.status); }

  const body = { message, content: b64, branch: BRANCH };
  if (sha) body.sha = sha;

  const p = await fetch(apiUrl, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!p.ok){
    let msg = 'HTTP ' + p.status;
    try { const j = await p.json(); if (j && j.message) msg += ' ' + j.message; } catch(_){}
    throw new Error(msg);
  }
  const out = await p.json();
  return (out.commit && out.commit.sha || '').slice(0, 7);
}

/* ---------- 上传：先图，后 meta（meta 指向已落地的图） ---------- */
async function uploadImage(token, pk){
  const imgCommit = await putFile(
    token, PATH, await blobToBase64(pk.blob),
    `chore: update ${PATH} via web`
  );
  const ts = new Date().toISOString();
  const meta = {
    v: 1,
    sha256: pk.sha,
    size: pk.blob.size,
    w: pk.w, h: pk.h,
    mime: pk.mime,
    orig: pk.orig,
    ts: ts,
    commit: imgCommit
  };
  await putFile(
    token, META_PATH, btoa(JSON.stringify(meta)),
    `chore: update ${META_PATH} via web`
  );
  return imgCommit;
}

/* ---------- 主流程 ---------- */
async function doUpload(){
  if (busy) return;
  const password = $('password').value;
  const file = fileRef;
  if (!cipherReady()){ log(PAD + 'Cipher not configured in upload.html', 'err'); return; }
  if (!password){ log(PAD + 'Password is required', 'err'); return; }
  if (!file){ log(PAD + 'No image selected', 'err'); return; }
  if (!/^image\//.test(file.type)){ log(PAD + 'Not an image file', 'err'); return; }
  if (file.size > 20 * 1024 * 1024){ log(PAD + 'Image larger than 20 MB', 'err'); return; }

  busy = true;
  logEl.innerHTML = '';
  focus = 0; refresh();
  keyEl.textContent = '处理中…';

  /* 0. 本地压缩（不联网，先把体积降下来） */
  let step = log(PAD + 'Compressing image locally...', 'work');
  let pk = pack;
  if (!pk){
    try { pk = await compressImage(file); pack = pk; }
    catch(e){
      step.className = 'err';
      step.textContent = BAD + 'Compress failed: ' + e.message;
      busy = false; keyEl.textContent = ''; refresh();
      return;
    }
  }
  step.className = 'ok';
  step.textContent = OK + 'Compressed ' + fmtKB(pk.orig) + ' → ' + fmtKB(pk.blob.size)
                   + '  ' + pk.w + '×' + pk.h + '  ' + pk.mime;

  /* 1. 本地只还原候选凭据，不判定对错（任意密码都走到这里） */
  step = log(PAD + 'Deriving candidate credential (Argon2id, 256 MiB, 3 passes)...', 'work');
  let token = null;
  try {
    token = await decryptToken(password, CIPHER_B64);
    step.className = 'ok';
    step.textContent = OK + 'Candidate credential ready (local check: none).';
  } catch(e) {
    step.className = 'err';
    step.textContent = BAD + 'Cipher structure broken: ' + e.message;
    busy = false; keyEl.textContent = ''; refresh();
    return;
  }

  /* 2. 对错只由 GitHub 判定：200 通过 / 401 密码错或凭据失效 / 其他为 API 异常 */
  step = log(PAD + 'Asking GitHub to validate the credential...', 'work');
  let verdict;
  try {
    verdict = await verifyToken(token);
  } catch(e) {
    step.className = 'err';
    step.textContent = BAD + 'GitHub unreachable (not a password verdict): ' + e.message;
    token = null; busy = false; keyEl.textContent = ''; refresh();
    return;
  }
  if (!verdict.ok){
    step.className = 'err';
    if (verdict.status === 401){
      step.textContent = BAD + 'HTTP 401 — password wrong, or the PAT expired / was revoked.';
    } else if (verdict.status === 403){
      step.textContent = BAD + 'HTTP 403 — credential lacks Contents: Read and write.';
    } else {
      step.textContent = BAD + 'HTTP ' + verdict.status + (verdict.message ? ' ' + verdict.message : '') +
                         ' — API error, not a password verdict.';
    }
    token = null; busy = false; keyEl.textContent = ''; refresh();
    return;
  }
  step.className = 'ok';
  step.textContent = OK + 'GitHub accepted the credential.';

  /* 3. 上传：图 + meta（含 sha256） */
  step = log(PAD + 'Uploading ' + PATH + ' (' + fmtKB(pk.blob.size) + ')...', 'work');
  let sha = '';
  try {
    sha = await uploadImage(token, pk);
    step.className = 'ok';
    step.textContent = OK + 'Uploaded ' + PATH + ' + ' + META_PATH + (sha ? ' (commit ' + sha + ')' : '');
  } catch(e) {
    step.className = 'err';
    step.textContent = BAD + e.message;
    token = null;
    busy = false; keyEl.textContent = ''; refresh();
    return;
  } finally {
    token = null;               // 立即丢弃 Token
  }

  /* 4. 清理 */
  step = log(PAD + 'Purging token from memory...', 'work');
  step.className = 'ok';
  step.textContent = OK + 'Token purged, password field cleared.';
  $('password').value = '';
  $('file').value = ''; fileRef = null; fileName = ''; pack = null; packSeq++;

  log('         meta 已写入 ' + META_PATH + '（sha256 版本戳）。', 'dim');
  log('→  Redirecting to ' + VIEW_URL + ' ...', 'dim');
  setTimeout(() => { location.replace(VIEW_URL); }, 900);
}

/* ---------------- kitty cursor_trail（同主页） ---------------- */
window.__trailPos = null;
window.__trailJump = true;

function pushRect(el){
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.width > 0) window.__trailPos = {x:r.left, y:r.top, w:r.width, h:r.height};
}

(function(){
  const cv = document.getElementById('trailcv');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d', {alpha:true});
  const N = 16, TR = 94, TG = 200, TB = 216;
  let W = 0, H = 0, dpr = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  let prev = null, cur = null, alpha = 0, dirty = null;

  function union(a,b){
    const x0 = Math.min(a.x,b.x), y0 = Math.min(a.y,b.y);
    const x1 = Math.max(a.x+a.w,b.x+b.w), y1 = Math.max(a.y+a.h,b.y+b.h);
    return {x:x0-2, y:y0-2, w:(x1-x0)+4, h:(y1-y0)+4};
  }

  let lastTs = 0;
  function frame(ts){
    if (!ts) ts = performance.now();
    const dt = lastTs ? Math.min(ts - lastTs, 60) : 16.7;
    lastTs = ts;
    const p = window.__trailPos;
    if (p && window.__trailJump){
      window.__trailJump = false;
      prev = p; cur = p; alpha = 0;
      if (dirty){ ctx.clearRect(0,0,W,H); dirty = null; }
    }
    if (p){
      if (!cur){ prev = p; cur = p; }
      else if (Math.abs(p.x-cur.x) > 0.5 || Math.abs(p.y-cur.y) > 0.5){
        prev = cur; cur = p; alpha = 1;
      }
    }
    if (alpha > 0.008 && prev && cur){
      if (Math.abs(prev.y - cur.y) > 0.4 || Math.abs(prev.x - cur.x) > 0.4){
        prev.x += (cur.x - prev.x) * 0.06;
        prev.y += (cur.y - prev.y) * 0.06;
        prev.w += (cur.w - prev.w) * 0.06;
        prev.h += (cur.h - prev.h) * 0.06;
      }
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba('+TR+','+TG+','+TB+','+(0.032*alpha).toFixed(3)+')';
      for (let i = 0; i < N; i++){
        const t = (i+0.5)/N;
        ctx.fillRect(prev.x+(cur.x-prev.x)*t, prev.y+(cur.y-prev.y)*t, cur.w, cur.h);
      }
      ctx.clearRect(cur.x, cur.y, cur.w, cur.h);
      dirty = union(prev, cur);
      alpha *= Math.pow(0.975, dt/16.7);
    } else if (dirty){
      ctx.clearRect(0, 0, W, H);
      dirty = null;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

render();
refresh();

try { app.focus({preventScroll:true}); } catch(_) {}
