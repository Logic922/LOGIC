<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>上传作业 · logicmokou</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
               connect-src https://api.github.com;
               img-src 'self' data: blob:;
               style-src 'self' 'unsafe-inline';
               font-src 'self';">
<link rel="preload" href="../fonts/hack-regular.woff2" as="font" type="font/woff2" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/argon2.umd.min.js"></script>
<style>
@font-face{font-family:Hack;src:url('../fonts/hack-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Hack;src:url('../fonts/hack-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0a1216; --fg:#d8e8ec; --dim:#7f99a2; --faint:#4c6570;
  --sel:#a8d8e4; --selfg:#0b2731; --line:#22303a;
  --c2:#6fbfa8; --c3:#c9b87f; --c4:#4aa8d8; --c5:#5ec8d8; --c6:#5ec8d8; --c14:#8fd6e0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 Hack,Menlo,Consolas,monospace;
  font-variant-ligatures:none;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-touch-callout:none;
  background-image:radial-gradient(120% 70% at 50% -10%,#0f2026 0%,#0a1216 62%);
}
.app{max-width:820px;margin:0 auto;min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.head{padding:16px 18px 0}
.logo-sm{margin:0;color:var(--c5);font-weight:700;font-size:13px;letter-spacing:.04em}
.logo-sm .v{color:#e0e2e8;font-weight:400;margin-left:1.4ch;font-size:11px}
.sub{margin-top:8px;color:var(--c6);font-weight:700;font-size:12px}
.mode{margin-top:1px;color:var(--faint);font-size:11px;word-break:break-all}

.body{padding:14px 18px 18px;min-width:0}

/* 表单：终端提示行风格 */
.row{display:flex;align-items:center;gap:1ch;min-height:26px;flex-wrap:wrap;margin-bottom:10px}
.row .pr{color:var(--c6);white-space:nowrap}
.row .pr b{color:#e0e2e8;font-weight:400}
input[type=password]{
  font:inherit;color:var(--fg);background:#0d181d;border:1px solid var(--line);
  border-radius:3px;padding:6px 8px;flex:1 1 12ch;min-width:0;outline:none;
}
input[type=password]:focus{border-color:var(--c4);box-shadow:0 0 0 1px rgba(74,168,216,.35)}
.filewrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:1ch}
.btn{
  font:inherit;color:var(--fg);background:#0e1b21;border:1px solid var(--line);
  border-radius:3px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap;
}
.btn:hover{border-color:#3c5f6b;color:#e8f3f6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--c4);border-color:#6cc0e0;color:#04161d;font-weight:700}
.btn.primary:hover{background:#6cc0e0}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.hint{color:var(--faint);font-size:11px}
.fname{color:var(--c14);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 预览 */
.preview{border:1px solid var(--line);border-radius:4px;background:#0d181d;
  padding:8px;display:none;margin:4px 0 12px;text-align:center}
.preview.on{display:block}
.preview img{max-width:100%;max-height:38vh;object-fit:contain;display:block;margin:0 auto}

/* 日志 */
.log{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;line-height:1.55}
.log p{margin:0;white-space:pre-wrap;word-break:break-all}
.log .ok{color:var(--c2)}
.log .work{color:var(--c4)}
.log .err{color:#e88b8b}
.log .dim{color:var(--faint)}
.log:empty{display:none}

.actions{display:flex;gap:1.2ch;flex-wrap:wrap;margin-top:14px}
a.btn{text-decoration:none;display:inline-block}

.statusbar{
  display:flex;align-items:center;gap:2ch;min-height:24px;padding:0 18px;
  background:#141b21;border-top:1px solid var(--line);color:var(--dim);font-size:11px;
}
.statusbar kbd{font:inherit;color:var(--fg);background:#202a32;border:1px solid #33404b;border-radius:2px;padding:0 3px}
.statusbar .pos{margin-left:auto;color:var(--faint);white-space:nowrap}
@media (max-width:640px){
  .head{padding:10px 12px 0}
  .body{padding:10px 12px 14px}
  .statusbar{padding:0 12px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="logo-sm">LOGICMOKOU<span class="v">v1.0</span></div>
    <div class="sub">学校相关 · 上传作业</div>
    <div class="mode">AES-GCM + Argon2id → github.com/Logic922/LOGIC</div>
  </div>

  <div class="body">
    <div class="row">
      <span class="pr">密码 ❯</span>
      <input id="password" type="password" placeholder="输入密码" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="row">
      <span class="pr">图片<b>   </b> ❯</span>
      <div class="filewrap">
        <button class="btn" id="pickBtn" type="button">选择图片</button>
        <span class="fname" id="fname">未选择</span>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="preview" id="preview"><img id="pv" alt="预览"></div>

    <div class="row">
      <button class="btn primary" id="uploadBtn" disabled>解密并上传</button>
      <span class="hint" id="hint">上传完成后自动跳转到查看页</span>
    </div>

    <div class="log" id="log"></div>

    <div class="actions">
      <a class="btn" href="../index.html">← 返回主页</a>
      <a class="btn" href="view.html">查看作业</a>
    </div>
  </div>

  <div class="statusbar">
    <span><kbd>Esc</kbd> 返回</span>
    <span class="hide-m"><kbd>↵</kbd> 开始上传</span>
    <span class="pos" id="pos">school/upload.html</span>
  </div>
</div>
<script>
/* ==================== 配置区（部署前修改这里） ==================== */
const CIPHER_B64 = "REPLACE_WITH_YOUR_CIPHER";   // 由 make-cipher.html 生成的密文
const REPO       = "Logic922/LOGIC";             // 仓库
const PATH       = "school/homework.png";        // 要替换的图片路径
const BRANCH     = "main";
const VIEW_URL   = "view.html";                  // 上传成功后跳转
/* ================================================================ */

const $ = id => document.getElementById(id);
const logEl = $('log');

function log(msg, cls){
  const p = document.createElement('p');
  p.className = cls || '';
  p.textContent = msg;
  logEl.appendChild(p);
  p.scrollIntoView({block:'nearest'});
  return p;
}
function setLine(p, msg, cls){ p.textContent = msg; p.className = cls || ''; }

function refreshBtn(){
  const pw = $('password').value;
  const f  = $('file').files[0];
  $('uploadBtn').disabled = !(pw && f);
}

$('pickBtn').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', () => {
  const f = $('file').files[0];
  $('fname').textContent = f ? `${f.name}  ${(f.size/1024).toFixed(1)} KB` : '未选择';
  const pv = $('preview'), img = $('pv');
  if (f){
    if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    const url = URL.createObjectURL(f);
    img.dataset.url = url;
    img.src = url;
    pv.classList.add('on');
  } else {
    pv.classList.remove('on');
  }
  refreshBtn();
});
$('password').addEventListener('input', refreshBtn);

/* ---------- Argon2id：参数必须与 make-cipher.html 完全一致 ---------- */
async function deriveKey(password, salt){
  if (!window.hashwasm || !hashwasm.argon2id) throw new Error('Argon2 库未加载（检查网络）');
  return await hashwasm.argon2id({
    password: password,
    salt: salt,
    parallelism: 4,
    iterations: 3,
    memorySize: 65536,   // KiB = 64 MiB
    hashLength: 32,
    outputType: 'binary'
  });
}

/* ---------- 解密 c → PAT b ---------- */
async function decryptToken(password, cB64){
  const c = Uint8Array.from(atob(cB64), ch => ch.charCodeAt(0));
  if (c.length < 29) throw new Error('密文长度不对');
  const salt  = c.slice(0, 16);
  const nonce = c.slice(16, 28);
  const ct    = c.slice(28);
  const rawKey = await deriveKey(password, salt);
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const pt  = await crypto.subtle.decrypt({ name:'AES-GCM', iv: nonce }, key, ct);
  return new TextDecoder().decode(pt);
}

/* ---------- 文件 → Base64（去掉 data: 前缀） ---------- */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('读取文件失败'));
    r.readAsDataURL(file);
  });
}

const encodePath = p => p.split('/').map(encodeURIComponent).join('/');

/* ---------- 上传（先取 sha，再 PUT） ---------- */
async function uploadImage(token, file){
  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  const apiUrl = `https://api.github.com/repos/${REPO}/contents/${encodePath(PATH)}`;

  let sha;
  const g = await fetch(`${apiUrl}?ref=${encodeURIComponent(BRANCH)}`, { headers, cache:'no-store' });
  if (g.ok){
    sha = (await g.json()).sha;
  } else if (g.status === 401){
    throw new Error('Token 无效或已过期，请重新生成并加密');
  } else if (g.status === 403){
    throw new Error('Token 权限不足（需要该仓库 Contents: Read and write）');
  } else if (g.status !== 404){
    const t = await g.text();
    throw new Error(`读取文件失败：${g.status} ${t.slice(0,120)}`);
  }

  const body = {
    message: `chore: update ${PATH} via web`,
    content: await fileToBase64(file),
    branch: BRANCH
  };
  if (sha) body.sha = sha;

  const p = await fetch(apiUrl, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!p.ok){
    let msg = p.status + '';
    try {
      const j = await p.json();
      if (j && j.message) msg += ' ' + j.message;
    } catch(_){}
    throw new Error(`上传失败：${msg}`);
  }
  const out = await p.json();
  return (out.commit && out.commit.sha || '').slice(0, 7);
}

/* ---------- 主流程 ---------- */
let busy = false;

async function doUpload(){
  if (busy) return;
  const password = $('password').value;
  const file = $('file').files[0];
  if (!password || !file) return;
  if (!/^image\//.test(file.type)){ log('✗ 选择的不是图片文件', 'err'); return; }
  if (!CIPHER_B64 || CIPHER_B64.indexOf('REPLACE') === 0 || CIPHER_B64.length < 40){
    log('✗ 还没配置密文：请先用 make-cipher.html 生成 c 并填进 CIPHER_B64', 'err');
    return;
  }
  if (file.size > 20 * 1024 * 1024){ log('✗ 图片太大（>20MB），请先压缩', 'err'); return; }

  busy = true;
  $('uploadBtn').disabled = true;
  logEl.innerHTML = '';
  $('hint').textContent = '处理中，请不要关闭页面';

  let token = null;
  const step1 = log('· 派生密钥并解密（Argon2id 约 1–2 秒）…', 'work');
  try {
    token = await decryptToken(password, CIPHER_B64);
    setLine(step1, '✓ 解密成功，Token 已就绪', 'ok');
  } catch(e) {
    setLine(step1, '✗ 密码错误，或密文被篡改', 'err');
    busy = false; $('hint').textContent = '请重新输入密码'; refreshBtn();
    return;
  }

  const step2 = log(`· 上传到 ${PATH} …`, 'work');
  let shaShort = '';
  try {
    shaShort = await uploadImage(token, file);
    setLine(step2, `✓ 上传成功${shaShort ? '（commit ' + shaShort + '）' : ''}`, 'ok');
  } catch(e) {
    setLine(step2, '✗ ' + e.message, 'err');
    token = null;
    busy = false; $('hint').textContent = '上传失败，可以重试'; refreshBtn();
    return;
  } finally {
    token = null;               // 立即丢弃 Token
  }

  $('password').value = '';
  $('file').value = '';
  log('· Token 已从内存清除', 'dim');
  log('· GitHub Pages 重建需要几十秒，查看页会先走 API 取最新图', 'dim');
  const step3 = log('→ 正在跳转到查看作业…', 'work');
  setTimeout(() => { location.replace(`${VIEW_URL}?fresh=${Date.now()}`); }, 900);
}

$('uploadBtn').addEventListener('click', doUpload);
$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); doUpload(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') location.href = '../index.html';
});

refreshBtn();
</script>
</body>
</html>
