<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>查看作业 · logicmokou</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               connect-src https://api.github.com;
               img-src 'self' data: blob:;
               style-src 'self' 'unsafe-inline';
               font-src 'self';">
<link rel="preload" href="../fonts/hack-regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Hack;src:url('../fonts/hack-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Hack;src:url('../fonts/hack-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0a1216; --fg:#d8e8ec; --dim:#7f99a2; --faint:#4c6570;
  --sel:#a8d8e4; --selfg:#0b2731;
  --c0:#0e1d23; --c1:#8fb6c4; --c2:#6fbfa8; --c3:#c9b87f;
  --c4:#4aa8d8; --c5:#5ec8d8; --c6:#5ec8d8; --c7:#e8f3f6;
  --c8:#7f99a2; --c12:#7fa8c8; --c14:#8fd6e0;
  --line:#1c2830;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 Hack,Menlo,Consolas,monospace;
  font-variant-ligatures:none;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
.app{
  max-width:820px;margin:0 auto;min-height:100%;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
}
.app:focus{outline:none}

/* ---------- 头部（与主页一致） ---------- */
.head{padding:16px 18px 0;overflow:hidden}
.logo-sm{margin:0;color:var(--c5);font-weight:700;font-size:13px;letter-spacing:.04em}
.logo-sm .v{color:#e0e2e8;font-weight:400;margin-left:1.4ch;font-size:11px}
.sub{margin-top:8px;color:var(--c6);font-weight:700;font-size:12px}
.mode{margin-top:1px;color:var(--faint);font-size:11px;word-break:break-all}

/* ---------- kitty cursor_trail（同主页） ---------- */
#trailcv{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ---------- 主体 ---------- */
.body{overflow-y:auto;overflow-x:hidden;padding:12px 18px 8px;min-height:0;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

/* 图片区：细线边框，无圆角 */
.frame{
  border:1px solid var(--line);background:transparent;
  padding:6px;text-align:center;min-height:96px;
  display:flex;align-items:center;justify-content:center;
}
.frame img{display:none;max-width:100%;max-height:52vh;object-fit:contain;background:#fff;
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;-webkit-user-drag:auto;}
.frame img.on{display:block}
.frame .ph{color:var(--faint);font-size:11.5px;line-height:1.7;padding:22px 6px;white-space:pre-wrap;word-break:break-word}

/* details 键值面板（同主页） */
.details{padding:10px 0 6px;color:var(--dim);font-size:11.5px;line-height:1.65;min-height:0}
.details .k{color:var(--faint);white-space:pre}
.details .d{color:var(--fg)}
.details .p{color:var(--c4);word-break:break-all}
.details .warn{color:var(--c3)}
.details .hint{color:var(--faint);margin-top:2px}

/* 菜单行（同主页 .item） */
.menu{padding:2px 0 0}
.item{
  display:flex;align-items:baseline;min-width:0;
  height:22px;line-height:22px;white-space:nowrap;
  color:var(--fg);padding-left:2ch;cursor:pointer;
}
.item .mk{width:2ch;color:var(--c4);font-weight:700;font-size:13px}
.item .nm{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--faint);margin-left:1.4ch;font-size:11px}
.item.focus{background:var(--sel);color:var(--selfg)}
.item.focus .mk{color:var(--selfg)}
.item.focus .nm{color:var(--selfg);font-weight:700}
.item.focus .meta{color:#2f4c56}

/* ---------- 底栏（同主页） ---------- */
.statusbar{
  display:flex;align-items:center;gap:2ch;height:24px;padding:0 18px;
  background:#141b21;border-top:1px solid var(--line);
  color:var(--dim);font-size:11px;user-select:none;
}
.statusbar .keys{display:flex;gap:1.4ch;flex:1;min-width:0;overflow:hidden}
.statusbar kbd{font:inherit;color:var(--fg);background:#202a32;border:1px solid #33404b;
  border-radius:2px;padding:0 3px}
.statusbar .keyhint{color:var(--c6);font-size:11px;min-width:0;overflow:hidden}
.statusbar .pos{color:var(--faint);white-space:nowrap}

@media (max-width:640px){
  .head{padding:10px 12px 0}
  .body{padding:10px 12px 6px}
  .statusbar{padding:0 12px}
  .statusbar .hide-m{display:none}
  .frame img{max-height:46vh}
  .item{padding-left:1ch}
}
</style>
</head>
<body>
<canvas id="trailcv"></canvas>
<div class="app" tabindex="0">
  <div class="head">
    <div class="logo-sm">LOGICMOKOU<span class="v">v1.0</span></div>
    <div class="sub">学校相关 · 查看作业</div>
    <div class="mode">github.com/Logic922/LOGIC &middot; school/homework.png</div>
  </div>

  <div class="body">
    <div class="frame">
      <div class="ph" id="ph">正在载入…</div>
      <img id="shot" alt="作业截图">
    </div>

    <div class="details">
      <div><span class="k">file     </span><span class="p">school/homework.png</span></div>
      <div><span class="k">updated  </span><span class="d" id="mDate">读取中…</span></div>
      <div><span class="k">size     </span><span class="d" id="mSize">&mdash;</span></div>
      <div><span class="k">px       </span><span class="d" id="mPx">&mdash;</span></div>
      <div><span class="k">version  </span><span class="d" id="mSha">&mdash;</span></div>
      <div class="hint" id="mHint"></div>
    </div>

    <div class="menu" id="menu"></div>
  </div>

  <div class="statusbar">
    <span class="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd> 移动</span>
      <span class="hide-m"><kbd>↵</kbd> 执行</span>
      <span><kbd>Esc</kbd> 返回</span>
    </span>
    <span class="keyhint" id="keyhint"></span>
    <span class="pos" id="pos"></span>
  </div>
</div>

<script>
/* ==================== 配置区 ==================== */
const REPO      = "Logic922/LOGIC";
const PATH      = "school/homework.png";
const META_PATH = "school/homework.meta.json";
const BRANCH    = "main";
const API       = `https://api.github.com/repos/${REPO}/contents/`;
const FILE_PAGE = `https://github.com/${REPO}/blob/${BRANCH}/${PATH}`;
/* ============================================== */

const $ = id => document.getElementById(id);
const img = $('shot'), ph = $('ph'), menuEl = $('menu'), keyEl = $('keyhint'), posEl = $('pos');

const fmtSize = b => b >= 1048576 ? (b/1048576).toFixed(2) + ' MB'
                  : b >= 1024    ? (b/1024).toFixed(1) + ' KB'
                  : b + ' B';

function fmtDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2,'0');
  const s = (Date.now() - d.getTime())/1000;
  const rel = s < 60 ? '刚刚' : s < 3600 ? Math.floor(s/60)+' 分钟前'
            : s < 86400 ? Math.floor(s/3600)+' 小时前' : Math.floor(s/86400)+' 天前';
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}  (${rel})`;
}

/* ==================== 数据层：只走 GitHub API ==================== */
function apiURL(path){
  return API + path.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(BRANCH);
}

/* 带超时的 fetch：网络挂住时必须能断，否则页面永远转圈 */
async function fetchT(url, opts, ms){
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    return await fetch(url, Object.assign({}, opts, { signal: ac.signal }));
  } catch(e) {
    if (e && e.name === 'AbortError') throw new Error('超时（' + Math.round(ms / 1000) + 's）');
    throw e;
  } finally {
    clearTimeout(t);
  }
}

/* Accept: application/vnd.github.raw → 直接拿文件字节，不经 base64/JSON 包装（省约 33% 体积） */
async function ghRaw(path, ms){
  const r = await fetchT(apiURL(path), {
    headers: { 'Accept': 'application/vnd.github.raw', 'X-GitHub-Api-Version': '2022-11-28' },
    cache: 'no-store'
  }, ms || 20000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}

/* 响应头的 Content-Type 跟着 .png 走，可能是错的（内容是 jpeg/webp）；按魔数纠正 */
function sniffMime(buf){
  const u = new Uint8Array(buf, 0, Math.min(16, buf.byteLength));
  if (u[0] === 0x89 && u[1] === 0x50) return 'image/png';
  if (u[0] === 0xFF && u[1] === 0xD8) return 'image/jpeg';
  if (u[0] === 0x52 && u[1] === 0x49 && u[8] === 0x57 && u[9] === 0x45) return 'image/webp';
  if (u[0] === 0x47 && u[1] === 0x49) return 'image/gif';
  return 'image/png';
}

async function ghImage(path){
  const buf = await (await ghRaw(path, 60000)).arrayBuffer();
  return new Blob([buf], { type: sniffMime(buf) });
}

async function fetchMeta(){
  try {
    const txt = await (await ghRaw(META_PATH, 8000)).text();
    const m = JSON.parse(txt);
    return (m && typeof m === 'object') ? m : null;
  } catch(_) { return null; }        // 还没写过 meta（只传过图）
}

/* meta 缺失时的兜底版本戳：最近一次提交（同为 API 端点，不是内容链路） */
async function fetchCommit(){
  try {
    const r = await fetchT(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(PATH)}&sha=${encodeURIComponent(BRANCH)}&per_page=1`, {
      headers: { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
      cache: 'no-store'
    }, 8000);
    if (!r.ok) return null;
    const list = await r.json();
    if (!list.length) return null;
    const c = list[0];
    const date = (c.commit && c.commit.committer && c.commit.committer.date)
              || (c.commit && c.commit.author && c.commit.author.date) || '';
    return { sha: c.sha, ts: date };
  } catch(_) { return null; }
}

/* ---------- 本地缓存：IndexedDB 存 {ver, meta, blob} ---------- */
const DB_NAME = 'homework-v1', STORE = 'img', KEY = 'current';

function idbOpen(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error('indexedDB'));
  });
}
async function cacheGet(){
  try {
    const db = await idbOpen();
    return await new Promise(res => {
      const t = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
      t.onsuccess = () => res(t.result || null);
      t.onerror = () => res(null);
    });
  } catch(_) { return null; }
}
async function cachePut(rec){
  try {
    const db = await idbOpen();
    await new Promise(res => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(rec, KEY);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
      tx.onabort = () => res();
    });
  } catch(_) {}
}

/* ---------- 渲染 ---------- */
let objURL = null, curBlob = null;
const MIME_EXT = { 'image/png':'png', 'image/jpeg':'jpg', 'image/webp':'webp', 'image/gif':'gif', 'image/heic':'heic' };
function showBlob(blob){
  curBlob = blob;
  img.onload = () => {
    ph.style.display = 'none'; img.classList.add('on');
    if (!$('mPx').textContent || $('mPx').textContent === '—')
      $('mPx').textContent = img.naturalWidth + '×' + img.naturalHeight;
  };
  img.onerror = () => { ph.className = 'ph'; ph.textContent = '图片解码失败'; };
  /* data: URL —— iOS 长按它一定会弹系统菜单（存储到照片 / 共享）；blob: 在部分 WebView 里没有菜单 */
  const fr = new FileReader();
  fr.onload = () => { img.src = fr.result; };
  fr.onerror = () => {
    if (objURL) URL.revokeObjectURL(objURL);
    objURL = URL.createObjectURL(blob);
    img.src = objURL;
  };
  fr.readAsDataURL(blob);
}

function paintMeta(m, blob){
  const iso = m && (m.ts || m.date);
  $('mDate').textContent = iso ? fmtDate(iso) : '—';
  $('mDate').className = 'd';
  const size = (m && m.size) || (blob ? blob.size : 0);
  $('mSize').textContent = size
    ? fmtSize(size) + (m && m.orig ? '（原图 ' + fmtSize(m.orig) + '）' : '')
    : '—';
  $('mPx').textContent = (m && m.w && m.h) ? m.w + '×' + m.h
    : (img.naturalWidth ? img.naturalWidth + '×' + img.naturalHeight : '—');
  $('mSha').textContent = (m && m.sha256) ? m.sha256.slice(0, 12)
    : (m && m.sha ? String(m.sha).slice(0, 7) : '—');
}

/* ---------- 主流程：先显缓存（0 等待）→ 后台比版本 → 有变化才下载 ---------- */
let loading = false;

async function loadImage(force){
  if (loading) return;
  loading = true;
  const t0 = performance.now();
  const hint = $('mHint');

  try {
    const cached = await cacheGet();
    const hasCache = !!(cached && cached.blob);

    /* 版本查询与图片下载并行发起，谁都别等谁 */
    const metaP = fetchMeta().then(m => m || fetchCommit()).catch(() => null);

    if (hasCache){
      /* 1. 有缓存：立刻出图，网络只用于校验 */
      showBlob(cached.blob);
      paintMeta(cached.meta, cached.blob);
      hint.textContent = force
        ? '重新下载中…'
        : '本地缓存 · ' + Math.round(performance.now() - t0) + ' ms · 校验中…';
    } else {
      ph.className = 'ph'; ph.textContent = '正在载入…'; ph.style.display = 'block';
      img.classList.remove('on');
    }

    /* 2. 冷启动或强制刷新：图直接下（不等 meta） */
    if (!hasCache || force){
      const imgP = ghImage(PATH);
      const blob = await imgP;
      showBlob(blob);
      const remote0 = await metaP;             // 信息到齐后补显示
      const ver0 = remote0 ? (remote0.sha256 || ('c:' + remote0.sha)) : null;
      paintMeta(remote0, blob);
      await cachePut({ ver: ver0, meta: remote0, blob, ts: Date.now() });
      hint.textContent = (force ? '已强制重新下载 · ' : 'API 直取（raw）· ')
        + fmtSize(blob.size) + ' · ' + Math.round(performance.now() - t0) + ' ms';
      if (!remote0){ $('mDate').textContent = '尚无上传记录'; $('mDate').className = 'd warn'; }
      return;
    }

    /* 3. 有缓存：等版本戳，一致就收工 */
    const remote = await metaP;
    const ver = remote ? (remote.sha256 || ('c:' + remote.sha)) : null;
    if (ver && cached.ver === ver){
      paintMeta(remote, cached.blob);
      hint.textContent = '缓存命中 · sha 一致 · 未下载 · ' + Math.round(performance.now() - t0) + ' ms';
      return;
    }

    /* 4. 版本不同（或查不到版本）→ 下载 */
    hint.textContent = '检测到新版本，下载中…';
    const blob = await ghImage(PATH);
    showBlob(blob);
    paintMeta(remote, blob);
    await cachePut({ ver, meta: remote, blob, ts: Date.now() });
    hint.textContent = 'API 直取（raw）· ' + fmtSize(blob.size) + ' · ' + Math.round(performance.now() - t0) + ' ms';
    if (!remote){ $('mDate').textContent = '尚无上传记录'; $('mDate').className = 'd warn'; }
  } catch(e) {
    const cached = await cacheGet();
    if (cached && cached.blob){
      showBlob(cached.blob);
      paintMeta(cached.meta, cached.blob);
      hint.textContent = '网络失败（' + e.message + '），显示上次缓存';
    } else {
      ph.className = 'ph';
      ph.textContent = e.message === 'HTTP 404'
        ? '还没有作业图片。\n先去「上传作业」传一张。'
        : '载入失败：' + e.message;
      img.classList.remove('on');
      hint.textContent = '';
    }
  } finally {
    loading = false;
  }
}

/* ---------- 操作项（与主页菜单同一套交互） ---------- */
const ITEMS = [
  { n:'打开原图', d:'新标签页打开 GitHub 文件页', run(){ window.open(FILE_PAGE, '_blank', 'noopener'); } },
  { n:'重新载入', d:'强制重新下载（不看 sha）',   run(){ reload(); } },
  { n:'上传作业', d:'换一张新的作业截图',        run(){ location.href = 'upload.html'; } },
  { n:'返回主页', d:'回到 logicmokou 主页',      run(){ location.href = '../index.html'; } },
  { n:'保存图片', d:'调起系统面板 → 存储到照片',  run(){ saveImage(); } }
];
let focus = 0;

/* 调系统分享面板 → 用户选「存储图像」即进相册；不支持时退化为新窗口打开图片 */
async function saveImage(){
  const h = $('mHint');
  if (!curBlob){ h.textContent = '图片还没载入，稍等一下'; return; }
  const name = 'homework.' + (MIME_EXT[curBlob.type] || 'png');
  try {
    const file = new File([curBlob], name, { type: curBlob.type || 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: '作业截图' });
      h.textContent = '已打开系统分享面板';
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }
  if (!objURL) objURL = URL.createObjectURL(curBlob);
  const w = window.open(objURL, '_blank');
  h.textContent = w ? '已在新窗口打开图片，长按即可存储' : '长按图片即可存储到照片';
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  menuEl.innerHTML = ITEMS.map((x, i) =>
    '<div class="item'+(i===focus?' focus':'')+'" data-i="'+i+'">' +
      '<span class="mk">'+(i===focus?'❯':'')+'</span>' +
      '<span class="nm">'+esc(x.n)+'</span>' +
      '<span class="meta">'+esc(x.d)+'</span></div>').join('');
  posEl.textContent = (focus+1) + '/' + ITEMS.length;
  pushRect(menuEl.querySelector('.item.focus'));
}
function paint(){
  const els = menuEl.querySelectorAll('.item');
  els.forEach((el, i) => {
    el.classList.toggle('focus', i === focus);
    el.querySelector('.mk').textContent = (i === focus) ? '❯' : '';
  });
  posEl.textContent = (focus+1) + '/' + ITEMS.length;
  pushRect(menuEl.querySelector('.item.focus'));
}
function move(d){
  focus = (focus + d + ITEMS.length) % ITEMS.length;
  paint();
}
function fire(){ const x = ITEMS[focus]; if (x) x.run(); }

/* 鼠标真的移动过才让 hover 抢焦点，避免载入瞬间指针位置把焦点拽走 */
let pointerMoved = false;
document.addEventListener('pointermove', () => { pointerMoved = true; }, {once:true});

menuEl.addEventListener('mouseover', e => {
  if (!pointerMoved) return;
  const el = e.target.closest('.item'); if (!el) return;
  const i = +el.dataset.i; if (i === focus) return;
  focus = i; paint();
});
menuEl.addEventListener('click', e => {
  const el = e.target.closest('.item'); if (!el) return;
  focus = +el.dataset.i; paint(); setTimeout(fire, 60);
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key || '';
  if (k === 'ArrowDown' || k === 'j'){ e.preventDefault(); move(1); }
  else if (k === 'ArrowUp' || k === 'k'){ e.preventDefault(); move(-1); }
  else if (k === 'Enter' || k === ' '){ e.preventDefault(); fire(); }
  else if (k === 'r'){ e.preventDefault(); reload(); }
  else if (k === 'Escape' || k === 'h' || k === 'q'){ location.href = '../index.html'; }
});

function reload(){ loadImage(true); }   /* 手动刷新：不管 sha，一律重下 */

/* ---------------- kitty cursor_trail（同主页） ---------------- */
window.__trailPos = null;
window.__trailJump = true;

function pushRect(el){
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.width > 0) window.__trailPos = {x:r.left, y:r.top, w:r.width, h:r.height};
}

(function(){
  const cv = document.getElementById('trailcv');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d', {alpha:true});
  const N = 16, TR = 94, TG = 200, TB = 216;
  let W = 0, H = 0, dpr = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  let prev = null, cur = null, alpha = 0, dirty = null;

  function union(a,b){
    const x0 = Math.min(a.x,b.x), y0 = Math.min(a.y,b.y);
    const x1 = Math.max(a.x+a.w,b.x+b.w), y1 = Math.max(a.y+a.h,b.y+b.h);
    return {x:x0-2, y:y0-2, w:(x1-x0)+4, h:(y1-y0)+4};
  }

  let lastTs = 0;
  function frame(ts){
    if (!ts) ts = performance.now();
    const dt = lastTs ? Math.min(ts - lastTs, 60) : 16.7;
    lastTs = ts;
    const p = window.__trailPos;
    if (p && window.__trailJump){
      window.__trailJump = false;
      prev = p; cur = p; alpha = 0;
      if (dirty){ ctx.clearRect(0,0,W,H); dirty = null; }
    }
    if (p){
      if (!cur){ prev = p; cur = p; }
      else if (Math.abs(p.x-cur.x) > 0.5 || Math.abs(p.y-cur.y) > 0.5){
        prev = cur; cur = p; alpha = 1;
      }
    }
    if (alpha > 0.008 && prev && cur){
      if (Math.abs(prev.y - cur.y) > 0.4 || Math.abs(prev.x - cur.x) > 0.4){
        prev.x += (cur.x - prev.x) * 0.06;
        prev.y += (cur.y - prev.y) * 0.06;
        prev.w += (cur.w - prev.w) * 0.06;
        prev.h += (cur.h - prev.h) * 0.06;
      }
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba('+TR+','+TG+','+TB+','+(0.032*alpha).toFixed(3)+')';
      for (let i = 0; i < N; i++){
        const t = (i+0.5)/N;
        ctx.fillRect(prev.x+(cur.x-prev.x)*t, prev.y+(cur.y-prev.y)*t, cur.w, cur.h);
      }
      ctx.clearRect(cur.x, cur.y, cur.w, cur.h);
      dirty = union(prev, cur);
      alpha *= Math.pow(0.975, dt/16.7);
    } else if (dirty){
      ctx.clearRect(0, 0, W, H);
      dirty = null;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* 初始化 */
render();
loadImage();
const app = document.querySelector('.app');
try { app.focus({preventScroll:true}); } catch(_) {}
</script>
