<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三球圆环 · 运动动画</title>
<style>
  :root{--ink:#171a1f;--sub:#5b6270;--line:#e2e6ec;--hl:#c2542d;--blue:#3f648c;--red:#d1483a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#eef1f5;color:var(--ink);
    font-family:"Noto Sans CJK SC","PingFang SC","Source Han Sans SC",-apple-system,sans-serif;}
  .app{max-width:1020px;margin:0 auto;padding:14px}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 2px 12px}
  .head h1{font-size:17px;margin:0;letter-spacing:.4px}
  .head span{font-size:12.5px;color:var(--sub)}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .stage{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(20,30,50,.08);overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:1.12/1;touch-action:manipulation}
  .cap{font-size:12.2px;color:var(--sub);padding:0 14px 11px;line-height:1.6}
  .panel{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(20,30,50,.08);padding:14px 15px 16px}
  .clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--sub);letter-spacing:.5px}
  .clock b{font-size:31px;color:var(--ink);font-weight:700;letter-spacing:0}
  .clock small{font-size:15px;margin-left:3px}
  .nxt{font-size:12.8px;color:#39414d;background:#f4f7fb;border-radius:8px;padding:8px 10px;margin:9px 0 12px;line-height:1.55;min-height:52px}
  .track{position:relative;height:9px;border-radius:5px;background:#e7ebf1;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3b7dd8,#c2542d)}
  .track i{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.95}
  .plab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px;
    font-variant-numeric:tabular-nums}
  .hint{font-size:11.8px;color:#4a5262;background:#f7f9fc;border-left:3px solid #c9d3e2;
    padding:6px 9px;border-radius:0 6px 6px 0;margin:9px 0 2px;line-height:1.6}
  .ctrls{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 4px}
  button,select{font:inherit;font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
    background:#fbfcfe;color:var(--ink);cursor:pointer}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.2px;color:#49505c;margin:9px 0 0;line-height:1.4}
  .chk input{width:15px;height:15px;accent-color:#c2542d}
  h4{font-size:12px;letter-spacing:2px;color:var(--sub);margin:16px 0 6px;font-weight:600}
  ol#log{list-style:none;margin:0;padding:0;max-height:250px;overflow:auto;
    -webkit-overflow-scrolling:touch;font-size:12.3px;line-height:1.6}
  ol#log li{padding:6px 8px;border-radius:7px;margin-bottom:5px;background:#f7f9fc;word-break:break-word}
  ol#log li:nth-child(1){background:#fff4ee;outline:1px solid #f3cdb8}
  .tag{display:inline-block;font-size:10.5px;color:#8a5a1f;background:#fdf1dd;border-radius:4px;
    padding:1px 5px;margin-left:2px;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>三球圆环 · 实时模拟</h1>
    <span>质量比 m : 2m : 2m，弹性碰撞，槽内匀速圆周</span>
  </div>

  <div class="wrap">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="cap"><b style="color:var(--red)">红球 A</b> 质量 m，<b style="color:var(--blue)">蓝球 B、C</b> 各 2m。
        两个蓝球完全相同，碰后"速度互换"在视觉上就是<b>互相穿过去</b>——这正是周期好数的原因。</div>
    </div>

    <aside class="panel">
      <div class="clock"><b id="tval">0.00</b><small>Δ</small>
        <span style="float:right;font-size:12px;padding-top:12px">第 <b id="cyc" style="font-size:13px">1</b> 个周期</span>
      </div>
      <p class="nxt" id="nxt">—</p>

      <div class="track"><div class="fill" id="fill"></div><i style="left:33.333%"></i><i style="left:66.667%"></i></div>
      <div class="plab"><span>0</span><span>5Δ</span><span>10Δ</span><span>15Δ</span></div>
      <p class="hint">每 5Δ 整体构型转 120°（三种球各就各位），转三次复原 ⇒
        <b>T = 15Δ = 10πR/v</b></p>

      <div class="ctrls">
        <button id="play" class="primary">暂停</button>
        <button id="stepbtn">→ 下次碰撞</button>
        <button id="reset">重置</button>
        <select id="spd" aria-label="速度">
          <option value="0.45">0.45×</option>
          <option value="0.7">0.7×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <label class="chk"><input type="checkbox" id="ghost"> 显示 0Δ 时三球的残影（对比"转 120°"）</label>

      <h4>碰撞记录</h4>
      <ol id="log"></ol>
    </aside>
  </div>
</div>
<script src="anim.js?v=8"></script>
</body>
</html>
