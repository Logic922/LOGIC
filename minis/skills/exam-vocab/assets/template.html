<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__ 生词表</title>
<style>
:root{
  --bg:#14161a; --bg2:#1b1e24; --bg3:#22262e; --fg:#d8dee9; --dim:#7d8797;
  --green:#9ece6a; --blue:#7aa2f7; --amber:#e0af68; --red:#f7768e; --purple:#bb9af7;
  --line:#2c313a;
}
html[data-theme="light"]{
  --bg:#fbfbf8; --bg2:#ffffff; --bg3:#f1f2ec; --fg:#1f2328; --dim:#6b7280;
  --green:#2e7d32; --blue:#1565c0; --amber:#a16207; --red:#b91c1c; --purple:#6d28d9;
  --line:#e2e4dd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:80px}
.mono{font-family:"SF Mono",Menlo,"Liberation Mono","Noto Sans Mono CJK SC",monospace}

header{position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.bar1{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.title{font-weight:700;font-size:16px;letter-spacing:.3px}
.title small{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
.cnt{color:var(--dim);font-size:12px;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--bg3);color:var(--fg);border-radius:8px;
  padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.searchbox{display:flex;align-items:center;gap:6px;margin:6px 14px;padding:8px 10px;
  background:var(--bg3);border:1px solid var(--line);border-radius:10px}
.searchbox .p{color:var(--green);font-weight:700}
#q{flex:1;background:none;border:0;color:var(--fg);font-size:15px;outline:none;font-family:inherit}
#q::placeholder{color:var(--dim)}
#clear{display:none;color:var(--dim);font-size:16px;padding:0 4px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--green);color:#14161a;border-color:var(--green);font-weight:600}
html[data-theme="light"] .chip.on{color:#fff}
main{padding:6px 0 40px}
.sechd{position:sticky;top:calc(var(--hdr,150px));z-index:10;background:var(--bg);padding:14px 16px 6px;
  font-size:12.5px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.sechd:after{content:"";flex:1;height:1px;background:var(--line)}
.word{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.word:active{background:var(--bg3)}
.l1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.w{font-size:16.5px;font-weight:650;color:var(--green);letter-spacing:.2px}
.pos{font-style:normal;color:var(--dim);font-size:12px}
.lv{font-style:normal;font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.lv.b1{color:#8a8f98} .lv.b2{color:var(--blue);border-color:#2f4a6d}
.lv.c1{color:var(--amber);border-color:#6b4f22} .lv.c2{color:var(--red);border-color:#6b2b34}
.lv.x{color:var(--purple);border-color:#3d2f5c}
.cn{color:var(--fg);font-size:14.5px}
.note{color:var(--amber);font-size:12.5px;margin-top:3px}
.ctx{color:var(--dim);font-size:12.5px;margin-top:3px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mark{margin-left:auto;color:var(--dim);font-size:15px;width:22px;text-align:center}
.mark.on{color:var(--amber)}
.det{display:none;margin-top:8px;padding:9px 11px;background:var(--bg3);border-radius:9px;font-size:13px}
.word.open .det{display:block}
.det .en{color:var(--dim);font-size:12.5px}
.det .ex{margin-top:6px;padding-left:8px;border-left:2px solid var(--line)}
.det .ex i{color:var(--dim);font-style:normal}
.empty{text-align:center;color:var(--dim);padding:50px 20px}
/* 原文视图 */
.passage{padding:0 16px 20px}
.passage h2{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:1px;
  margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.passage p{margin:0 0 10px;font-size:14.5px;line-height:1.75;color:var(--fg)}
.passage p.opt{color:var(--dim);font-size:13px}
.hw{color:var(--green);border-bottom:1px solid rgba(158,206,106,.45);cursor:pointer}
.hw.hit{background:rgba(224,175,104,.25);border-radius:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);
  border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid var(--line);
  padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto;
  transform:translateY(102%);transition:transform .22s ease;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.sheet.on{transform:translateY(0)}
.sheet .sh{position:relative}
.sheet .big{font-size:22px;font-weight:700;color:var(--green)}
.sheet .close{position:absolute;right:0;top:-4px;color:var(--dim);font-size:20px;cursor:pointer}
.sheet .gloss{font-size:16px;margin-top:6px}
.sheet .nt{color:var(--amber);font-size:13px;margin-top:5px}
.sheet .d{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.sheet .d b{color:var(--fg);font-weight:600}
.sheet .exs{margin-top:8px;font-size:13px}
.sheet .exs div{margin-bottom:6px;padding-left:8px;border-left:2px solid var(--line)}
.sheet .exs i{color:var(--dim);font-style:normal;display:block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;display:none}
.mask.on{display:block}
footer{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg2);border-top:1px solid var(--line);
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));display:flex;gap:6px}
footer .seg{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:13px;color:var(--dim);cursor:pointer}
footer .seg.on{background:var(--bg3);color:var(--fg);font-weight:600}
@media print{
  html{--bg:#fff;--bg2:#fff;--bg3:#f7f7f5;--fg:#111;--dim:#555;--line:#ddd;--green:#111;--amber:#444;--blue:#111;--purple:#111;--red:#111}
  header,footer,.mark,.btn{position:static}
  .chips,.searchbox,.btn{display:none}
  .word{break-inside:avoid}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="bar1">
    <div class="title">__TITLE__ <small>试卷生词 · CEFR 分级</small></div>
    <span class="cnt" id="cnt"></span>
    <button class="btn" id="theme">☀︎</button>
  </div>
  <div class="searchbox">
    <span class="p mono">/</span>
    <input id="q" placeholder="搜单词或中文释义…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <span id="clear">✕</span>
  </div>
  <div class="chips" id="secchips"></div>
  <div class="chips" id="lvchips"></div>
</header>

<main id="list"></main>
<main id="src" class="passage" style="display:none"></main>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>

<footer>
  <div class="seg on" data-view="list">词表</div>
  <div class="seg" data-view="src">原文对照</div>
  <div class="seg" data-sort="alpha">A→Z</div>
  <div class="seg" data-mark="1">★ 我的标记</div>
</footer>

<script>
const DATA = __DATA__;
const LVNAME = {b1:'B1',b2:'B2',c1:'C1',c2:'C2',x:'超纲'};
let state = {q:'', sec:'all', lv:'all', view:'list', sort:'sec', onlyMark:false};
const marks = new Set(JSON.parse(localStorage.getItem('v26marks')||'[]'));
const saveMarks = () => localStorage.setItem('v26marks', JSON.stringify([...marks]));

// flatten
const ALL = [];
DATA.sections.forEach(s => s.words.forEach(w => { w.sec = s.id; w.secTitle = s.title; ALL.push(w); }));

const $ = s => document.querySelector(s);
const hdr = $('#hdr');
function fitHdr(){ document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px'); }
window.addEventListener('resize', fitHdr);

/* ---------- chips ---------- */
const secs = [['all','全部'], ...DATA.sections.map(s=>[s.id, s.title.replace('阅读 ','').replace('语法填空','语法')])];
const lvs = [['all','全部等级'],['b1','B1'],['b2','B2'],['c1','C1'],['c2','C2'],['x','超纲/短语']];
function renderChips(){
  $('#secchips').innerHTML = secs.map(([k,v])=>`<button class="chip ${state.sec===k?'on':''}" data-sec="${k}">${v}</button>`).join('');
  $('#lvchips').innerHTML = lvs.map(([k,v])=>`<button class="chip ${state.lv===k?'on':''}" data-lv="${k}">${v}</button>`).join('');
}
document.addEventListener('click', e=>{
  const c = e.target.closest('.chip');
  if(c && c.dataset.sec){ state.sec = c.dataset.sec; renderChips(); render(); }
  if(c && c.dataset.lv){ state.lv = c.dataset.lv; renderChips(); render(); }
});

/* ---------- filter ---------- */
function match(w){
  if(state.sec !== 'all' && w.sec !== state.sec) return false;
  if(state.lv !== 'all' && w.lv !== state.lv) return false;
  if(state.onlyMark && !marks.has(w.w)) return false;
  const q = state.q.trim().toLowerCase();
  if(!q) return true;
  return w.w.toLowerCase().includes(q) || w.cn.toLowerCase().includes(q) ||
         (w.note||'').toLowerCase().includes(q) || (w.dex||'').toLowerCase().includes(q);
}

/* ---------- list ---------- */
function rowHTML(w, i){
  const lv = LVNAME[w.lv] || '';
  return `<div class="word" data-i="${i}">
    <div class="l1"><span class="w mono">${esc(w.w)}</span><span class="pos">${esc(w.pos)}</span>
      ${lv?`<span class="lv ${w.lv}">${lv}</span>`:''}<span class="cn">${esc(w.cn)}</span>
      <span class="mark ${marks.has(w.w)?'on':''}" data-mk="${esc(w.w)}">${marks.has(w.w)?'★':'☆'}</span></div>
    ${w.note?`<div class="note">${esc(w.note)}</div>`:''}
    ${w.ctx?`<div class="ctx">${esc(w.ctx)}</div>`:''}
    <div class="det">${detHTML(w)}</div>
  </div>`;
}
function detHTML(w){
  let s = '';
  if(w.en) s += `<div class="en">OALD: ${esc(w.en)}${w.dex?' — '+esc(w.dex):''}</div>`;
  if(w.ex && w.ex.length) s += `<div class="exs">` + w.ex.filter(x=>x[0]).map(x=>
      `<div class="ex">${esc(x[0])}${x[1]?`<i>${esc(x[1])}</i>`:''}</div>`).join('') + `</div>`;
  if(w.ctx) s += `<div class="ex"><i>原文：${esc(w.ctx)}</i></div>`;
  return s || '<div class="en">（无词典释义）</div>';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const list = $('#list'), src = $('#src');
  const showSrc = state.view === 'src';
  list.style.display = showSrc ? 'none' : '';
  src.style.display = showSrc ? '' : 'none';
  const items = ALL.filter(match);
  $('#cnt').textContent = items.length + ' / ' + ALL.length;
  if(showSrc){ renderSrc(items); return; }

  if(!items.length){ list.innerHTML = '<div class="empty">没有匹配的词<br><span style="font-size:12px">试试英文前缀或中文</span></div>'; return; }
  let html = '';
  if(state.sort === 'alpha'){
    const sorted = [...items].sort((a,b)=>a.w.toLowerCase().localeCompare(b.w.toLowerCase()));
    let cur = '';
    sorted.forEach((w,i)=>{
      const L = w.w[0].toUpperCase();
      if(L !== cur){ cur = L; html += `<div class="sechd">${L}</div>`; }
      html += rowHTML(w, ALL.indexOf(w));
    });
  } else {
    const groups = {};
    items.forEach(w=>{ (groups[w.sec] = groups[w.sec] || []).push(w); });
    DATA.sections.forEach(s=>{
      const g = groups[s.id]; if(!g) return;
      html += `<div class="sechd">${esc(s.title)} · ${g.length}</div>`;
      g.forEach(w=>{ html += rowHTML(w, ALL.indexOf(w)); });
    });
  }
  list.innerHTML = html;
  fitHdr();
}

/* ---------- 原文 ---------- */
function renderSrc(items){
  const hit = new Set(items.map(w=>w.w.toLowerCase()));
  let html = '';
  DATA.sections.forEach(s=>{
    html += `<h2>${esc(s.title)}</h2>`;
    let txt = esc(s.text);
    // wrap words present in dictionary list of this section
    const ws = [...s.words].sort((a,b)=>b.w.length-a.w.length);
    const alts = ws.map(w=>{
      const base = w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return (w.w.includes(' ') ? base : base + '(?:s|es|ed|ing|d)?');
    }).join('|');
    if(alts){
      try{
        const re = new RegExp('(?<![A-Za-z])(' + alts + ')(?![a-z])','gi');
        txt = txt.replace(re, m=>{
          const low = m.toLowerCase();
          const found = ws.find(w=>low === w.w.toLowerCase() || low === w.w.toLowerCase()+'s' || low.startsWith(w.w.toLowerCase()));
          if(!found) return m;
          const cls = hit.has(found.w.toLowerCase()) ? 'hw hit' : 'hw';
          return `<span class="${cls}" data-w="${esc(found.w)}">${m}</span>`;
        });
      }catch(err){}
    }
    txt = txt.replace(/(\d+\.\s[A-D]\.)/g, '<br>$1');
    html += `<p>${txt}</p>`;
  });
  $('#src').innerHTML = html;
}

/* ---------- interactions ---------- */
document.addEventListener('click', e=>{
  const mk = e.target.closest('[data-mk]');
  if(mk){ e.stopPropagation();
    const w = mk.dataset.mk;
    if(marks.has(w)) marks.delete(w); else marks.add(w);
    saveMarks(); mk.classList.toggle('on'); mk.textContent = marks.has(w)?'★':'☆';
    if(state.onlyMark) render();
    return;
  }
  const hw = e.target.closest('.hw');
  if(hw){ openSheet(hw.dataset.w); return; }
  const row = e.target.closest('.word');
  if(row){ row.classList.toggle('open'); }
});

function openSheet(key){
  const w = ALL.find(x=>x.w === key) || ALL.find(x=>x.w.toLowerCase() === key.toLowerCase());
  if(!w) return;
  const lv = LVNAME[w.lv] || '';
  $('#sheet').innerHTML = `<div class="sh"><span class="close" onclick="closeSheet()">✕</span>
    <div class="big mono">${esc(w.w)}</div>
    <div><span class="pos">${esc(w.pos)}</span> ${lv?`<span class="lv ${w.lv}">${lv}</span>`:''}
      <span style="color:var(--dim);font-size:12px;margin-left:6px">${esc(w.secTitle)}</span></div>
    <div class="gloss">${esc(w.cn)}</div>
    ${w.note?`<div class="nt">${esc(w.note)}</div>`:''}
    ${w.en?`<div class="d"><b>释义</b> ${esc(w.en)}${w.dex?'<br>'+esc(w.dex):''}</div>`:''}
    ${w.ex&&w.ex.length?`<div class="exs">${w.ex.filter(x=>x[0]).map(x=>
        `<div>${esc(x[0])}${x[1]?`<i>${esc(x[1])}</i>`:''}</div>`).join('')}</div>`:''}
    ${w.ctx?`<div class="d"><b>原文</b> ${esc(w.ctx)}</div>`:''}
  </div>`;
  $('#sheet').classList.add('on'); $('#mask').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#mask').classList.remove('on'); }
$('#mask').onclick = closeSheet;

/* ---------- search / nav ---------- */
const q = $('#q');
q.addEventListener('input', ()=>{
  state.q = q.value;
  $('#clear').style.display = q.value ? 'block' : 'none';
  render();
});
$('#clear').onclick = ()=>{ q.value=''; state.q=''; $('#clear').style.display='none'; render(); q.focus(); };
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape'){ q.value=''; state.q=''; $('#clear').style.display='none'; closeSheet(); render(); }
});

document.querySelectorAll('footer .seg').forEach(s=>{
  s.onclick = ()=>{
    if(s.dataset.view){
      state.view = s.dataset.view;
      document.querySelectorAll('footer .seg[data-view]').forEach(x=>x.classList.toggle('on', x===s));
    }
    if(s.dataset.sort){
      state.sort = state.sort === 'alpha' ? 'sec' : 'alpha';
      s.classList.toggle('on', state.sort==='alpha');
      s.textContent = state.sort==='alpha' ? '# 按板块' : 'A→Z';
    }
    if(s.dataset.mark){
      state.onlyMark = !state.onlyMark;
      s.classList.toggle('on', state.onlyMark);
    }
    render();
  };
});

$('#theme').onclick = ()=>{
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
  $('#theme').textContent = d.dataset.theme === 'dark' ? '☀︎' : '☾';
  localStorage.setItem('v26theme', d.dataset.theme);
};
if(localStorage.getItem('v26theme')){ document.documentElement.dataset.theme = localStorage.getItem('v26theme');
  $('#theme').textContent = localStorage.getItem('v26theme')==='dark'?'☀︎':'☾'; }

renderChips(); render(); fitHdr(); setTimeout(fitHdr, 300);
</script>
</body>
</html>
